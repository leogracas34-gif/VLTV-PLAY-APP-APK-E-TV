name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: '9.5.1'

    # ✅ NOVO: recria o debug.keystore na raiz do repo a partir do Secret
    # DEBUG_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions).
    # O keystore nunca fica commitado no repositório — só existe durante
    # esta execução do build, dentro do runner do Actions.
    - name: Recriar debug.keystore a partir do Secret
      run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

    # ✅ CORRIGIDO: adicionado "clean" antes do "assembleDebug".
    # O cache do Gradle (dependências) continua sendo reaproveitado
    # normalmente — isso só apaga os arquivos INTERMEDIÁRIOS do seu
    # projeto (pasta app/build/), incluindo o R.java gerado a partir
    # dos recursos (layouts, strings, drawables). Sem isso, quando um
    # layout novo era adicionado, às vezes o build reaproveitava um
    # R.java antigo (de antes do arquivo existir), causando erros como
    # "Resources$NotFoundException: Resource ID #0x..." em tempo de
    # execução, mesmo com o arquivo certinho no repositório.
    - name: Build with Gradle
      run: gradle clean assembleDebug --stacktrace

    # ✅ CORRIGIDO: adicionado "retention-days: 3" para os artifacts
    # serem apagados automaticamente depois de 3 dias, evitando estourar
    # a cota de armazenamento de artifacts do GitHub (erro "Artifact
    # storage quota has been hit").
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 3
